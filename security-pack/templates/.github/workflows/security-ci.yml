# Security CI template. Runs on every pull request and on pushes to main.
# Copy into the app repo at .github/workflows/security-ci.yml (with ../dependabot.yml and ../CODEOWNERS),
# then mark the jobs below as required status checks in a branch ruleset for main.
#
# ADAPT before use: this template does not assume a language or package manager.
#   1. Set the commands in the top-level `env:` block. Node/npm values are shown as an EXAMPLE only.
#      Leave a command empty ("") to skip that step.
#   2. Replace the toolchain setup step in build-test (marked ADAPT) with your language's setup action.
#   3. Set CODEQL_LANGUAGES to the languages in your repo.
# Language-neutral jobs (gitleaks, semgrep, osv-scanner, dependency review) need no changes.
#
# Optional switches (Settings > Secrets and variables > Actions > Variables):
#   ENABLE_CODEQL=true          run CodeQL on a private repo (needs GitHub Code Security). Public repos run it automatically.
#   ENABLE_CLAUDE_REVIEW=true   run the AI review job (needs secret ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN).

name: security-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # ADAPT: your project's commands. EXAMPLE values for Node/npm.
  # Python example: INSTALL_CMD="pip install -r requirements.txt", LINT_CMD="ruff check .", TYPECHECK_CMD="mypy .", TEST_CMD="pytest"
  # Go example: INSTALL_CMD="go mod download", LINT_CMD="go vet ./...", TYPECHECK_CMD="", TEST_CMD="go test ./...", BUILD_CMD="go build ./..."
  INSTALL_CMD: npm ci
  LINT_CMD: npm run lint
  TYPECHECK_CMD: npm run typecheck
  TEST_CMD: npm test
  BUILD_CMD: npm run build
  # Optional extra audit with your package manager's own tool. EXAMPLE (npm). Python: "pip-audit". Leave "" to rely on osv-scanner.
  PM_AUDIT_CMD: npm audit --omit=dev --audit-level=high
  # ADAPT: CodeQL languages, comma-separated (for example javascript-typescript, python, go, java-kotlin, ruby, csharp).
  CODEQL_LANGUAGES: javascript-typescript

jobs:
  build-test:
    name: lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ADAPT: toolchain setup. EXAMPLE (Node). Use actions/setup-python, actions/setup-go, etc. for other
      # languages, pinned to a commit SHA.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - name: Install
        if: env.INSTALL_CMD != ''
        run: eval "$INSTALL_CMD"
      - name: Lint
        if: env.LINT_CMD != ''
        run: eval "$LINT_CMD"
      - name: Typecheck
        if: env.TYPECHECK_CMD != ''
        run: eval "$TYPECHECK_CMD"
      - name: Test
        if: env.TEST_CMD != ''
        run: eval "$TEST_CMD"
        env:
          CI: "true"
      - name: Build
        if: env.BUILD_CMD != ''
        run: eval "$BUILD_CMD"
      - name: Package manager audit (optional)
        if: env.PM_AUDIT_CMD != ''
        run: eval "$PM_AUDIT_CMD"

  gitleaks:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan full history, not just the last commit
      - name: Install gitleaks
        run: |
          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          cd "$RUNNER_TEMP"
          # Keep the release filename: sha256sum -c looks up the file named in the checksums list.
          curl -sSfL -o "$TARBALL" "$BASE/$TARBALL"
          curl -sSfL -o checksums.txt "$BASE/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${TARBALL}\$" checksums.txt | sha256sum -c -
          tar -xzf "$TARBALL" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan
        run: gitleaks git . --redact --verbose --exit-code 1

  semgrep:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: semgrep scan --config auto --error

  codeql:
    name: SAST (CodeQL)
    if: ${{ !github.event.repository.private || vars.ENABLE_CODEQL == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ env.CODEQL_LANGUAGES }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
  dependency-audit:
    name: dependency audit (osv-scanner)
    runs-on: ubuntu-latest
    env:
      OSV_SCANNER_VERSION: 2.7.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install osv-scanner
        run: |
          BIN="osv-scanner_linux_amd64"
          BASE="https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}"
          cd "$RUNNER_TEMP"
          curl -sSfL -o "$BIN" "$BASE/$BIN"
          curl -sSfL -o SHA256SUMS "$BASE/osv-scanner_SHA256SUMS"
          grep " ${BIN}\$" SHA256SUMS | sha256sum -c -
          mv "$BIN" osv-scanner && chmod +x osv-scanner
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan all lockfiles and manifests against OSV
        # Language-neutral: reads most lockfile formats (npm, pnpm, yarn, pip, poetry, uv, go, cargo, maven, ...).
        run: osv-scanner scan source -r .

  dependency-review:
    name: dependency review
    if: ${{ github.event_name == 'pull_request' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  claude-review:
    name: AI review (optional)
    # Same-repo PRs only: fork PRs get no secrets, and untrusted PR content is a prompt-injection risk.
    if: >-
      vars.ENABLE_CLAUDE_REVIEW == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Or, with a Claude subscription: claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
