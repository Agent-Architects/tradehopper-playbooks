# Security CI for a Next.js / Node (TypeScript) app. Runs on every pull request and on pushes to main.
# Copy into the app repo at .github/workflows/security-ci.yml, then mark the jobs below as required
# status checks in a branch ruleset for main.
#
# Optional switches (Settings > Secrets and variables > Actions > Variables):
#   ENABLE_CODEQL=true          run CodeQL on a private repo (needs GitHub Code Security). Public repos run it automatically.
#   ENABLE_CLAUDE_REVIEW=true   run the AI review job (needs secret ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN).

name: security-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: detect project type
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.check.outputs.node }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          if [ -f package-lock.json ]; then echo "node=true" >> "$GITHUB_OUTPUT"; else echo "node=false" >> "$GITHUB_OUTPUT"; fi

  build-test:
    name: lint, typecheck, test
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint --if-present
      - name: Typecheck
        run: |
          if npm run | grep -qE '^  typecheck$'; then npm run typecheck; else npx --no-install tsc --noEmit; fi
      - name: Test
        run: npm run test --if-present
        env:
          CI: "true"
      - name: Build
        run: npm run build --if-present

  gitleaks:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan full history, not just the last commit
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz$" checksums.txt | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan
        run: ./gitleaks git . --redact --verbose --exit-code 1

  semgrep:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      - run: semgrep scan --config auto --error

  codeql:
    name: SAST (CodeQL)
    if: ${{ !github.event.repository.private || vars.ENABLE_CODEQL == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4

  dependency-audit:
    name: dependency audit
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: npm audit (production dependencies, high and critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Verify registry signatures
        run: |
          npm ci --ignore-scripts
          npm audit signatures

  dependency-review:
    name: dependency review
    if: ${{ github.event_name == 'pull_request' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  claude-review:
    name: AI review (optional)
    # Same-repo PRs only: fork PRs get no secrets, and untrusted PR content is a prompt-injection risk.
    if: >-
      vars.ENABLE_CLAUDE_REVIEW == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Or, with a Claude subscription: claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
